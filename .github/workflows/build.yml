name: Build and Publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build:web
      - run: |
          mkdir -p release/vps-monitor
          cp -r apps/api apps/worker packages deploy release/vps-monitor/
          mkdir -p release/vps-monitor/apps/web
          cp -r apps/web/dist release/vps-monitor/apps/web/dist
          cp package.json .env.example release/vps-monitor/
          tar -czf vps-monitor-linux.tar.gz -C release vps-monitor
      - uses: actions/upload-artifact@v4
        with:
          name: vps-monitor-linux
          path: vps-monitor-linux.tar.gz
  docker:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/deradream/vpsmonitor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
