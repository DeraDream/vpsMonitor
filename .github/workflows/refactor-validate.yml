name: Refactor Validation

on:
  push:
    branches:
      - refactor/vue-api-worker

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild refactor candidate
        run: |
          mkdir -p /tmp/vps-monitor-refactor
          cat .refactor/chunk*.b64 | base64 -d > /tmp/vps-monitor-refactor.tar.gz
          tar -xzf /tmp/vps-monitor-refactor.tar.gz -C /tmp/vps-monitor-refactor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: /tmp/vps-monitor-refactor
        run: npm install
      - name: Static checks
        working-directory: /tmp/vps-monitor-refactor
        run: npm run check
      - name: Tests
        working-directory: /tmp/vps-monitor-refactor
        run: npm test
      - name: Vue production build
        working-directory: /tmp/vps-monitor-refactor
        run: npm run build:web
      - name: Verify production artifacts
        working-directory: /tmp/vps-monitor-refactor
        run: |
          test -f apps/web/dist/index.html
          test -d apps/web/dist/assets
          test -f Dockerfile
          test -f docker-compose.yml
          test -f deploy/install.sh
      - name: Materialize validated refactor on branch
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/vps-monitor-refactor/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: split Vue frontend API and worker"
          git push origin HEAD:refactor/vue-api-worker
