<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1423" />
    <title>VPS Monitor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/overrides.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview"><span class="brand-mark">V</span><span>VPS Monitor</span></a>
        <div class="runtime"><i></i><span>监控服务待配置</span></div>
        <nav aria-label="主导航">
          <a href="#overview" class="nav-link active" data-route="overview">概览</a>
          <a href="#monitors" class="nav-link" data-route="monitors">监控</a>
          <a href="#providers" class="nav-link" data-route="providers">商家</a>
          <a href="#events" class="nav-link" data-route="events">补货事件</a>
          <a href="#settings" class="nav-link" data-route="settings">通知设置</a>
        </nav>
        <div class="sidebar-foot">个人实例<br><span>v0.1.0</span></div>
      </aside>
      <main>
        <header class="topbar"><div><p class="eyebrow" id="crumb">概览</p><h1 id="page-title">实时状态</h1></div><button class="button secondary" id="refresh-button">立即刷新</button></header>
        <section id="view" aria-live="polite"></section>
      </main>
    </div>
    <dialog id="monitor-dialog"><form method="dialog" class="dialog-card" id="monitor-form"><button class="close" value="cancel" aria-label="关闭">×</button><div id="monitor-content"></div></form></dialog>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
